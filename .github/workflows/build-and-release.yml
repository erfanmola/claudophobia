name: Build & Release

on:
   push:
      branches: [master]
      tags: ["v*"]
   pull_request:
      branches: [master]

jobs:
   build:
      name: Build, test & package
      runs-on: macos-latest
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Show toolchain
           run: |
              swift --version
              xcodebuild -version

         - name: Build (release)
           run: swift build -c release

         - name: Run tests
           run: swift test

         - name: Package .app bundle
           run: bash scripts/build_app.sh

         - name: Verify bundle
           run: |
              test -d dist/Claudophobia.app && echo "bundle OK"
              codesign -dv dist/Claudophobia.app 2>&1 | head -2

         - name: Zip app
           run: |
              cd dist
              zip -r Claudophobia-macOS.zip Claudophobia.app

         - name: Upload artifact
           uses: actions/upload-artifact@v4
           with:
              name: Claudophobia-macOS
              path: dist/Claudophobia-macOS.zip
              retention-days: 14

   release:
      name: Publish GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      needs: build
      runs-on: macos-latest
      permissions:
         contents: write
      steps:
         - name: Checkout
           uses: actions/checkout@v4

         - name: Download artifact
           uses: actions/download-artifact@v4
           with:
              name: Claudophobia-macOS
              path: dist

         - name: Create Release
           env:
              GH_TOKEN: ${{ github.token }}
           run: |
              cat > release-notes.md <<EOF
              Automated build from $GITHUB_SHA.

              ### Install
              Download \`Claudophobia-macOS.zip\`, unzip, and move \`Claudophobia.app\` to /Applications.

              > Ad-hoc signed: right-click → Open the first time.

              _This release was created automatically by the Build & Release workflow._
              EOF

              gh release create "$GITHUB_REF_NAME" \
                "dist/Claudophobia-macOS.zip" \
                --title "Claudophobia $GITHUB_REF_NAME" \
                --notes-file release-notes.md
